function roundAwayFromZero(x) {
  if (Math.abs(x) < 0.5) return 0;
  return x > 0 ? Math.ceil(x) : Math.floor(x);
}
function circularMove(arr, idx, delta) {
  var n = arr.length;
  var steps = roundAwayFromZero(delta);
  return ((idx + steps) % n + n) % n;
}

function makeProgressBar(currentQ, totalQ, numQuestionsInThisSurvey) {
  return function() {
    var totalQuestions = 4 + 16 + 12 + 32;
    var questionsBefore = [0, 4, 20, 32];
    var doneCount = questionsBefore[currentQ - 1];

    var bar = document.createElement('div');
    bar.id = 'survey-progress';
    bar.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999;
      background: #f0f0f0;
      padding: 8px 20px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    `;

    function updateBar(answeredInThisSurvey) {
      var totalAnswered = doneCount + answeredInThisSurvey;
      var pct = Math.round((totalAnswered / totalQuestions) * 100);
      bar.innerHTML = `
        <span style="font-size:13px;color:#555;white-space:nowrap;">
          Survey ${currentQ} of ${totalQ}
        </span>
        <div style="flex:1;background:#ddd;border-radius:999px;height:10px;">
          <div style="width:${pct}%;background:#5a7fdb;height:10px;border-radius:999px;transition:width 0.3s;"></div>
        </div>
        <span style="font-size:13px;color:#555;white-space:nowrap;">${pct}% complete</span>
      `;
    }

    updateBar(0);

    // Remove any existing bar before appending new one
    document.querySelectorAll('#survey-progress').forEach(function(el) {
      el.remove();
    });
    document.body.appendChild(bar);

  // Add survey top margin to make room for progress bar
  setTimeout(function() {
  var preamble = document.querySelector('.jspsych-survey-multi-choice-preamble');
  console.log('preamble found:', preamble);
  if (preamble) preamble.style.marginTop = '50px';
  }, 50);


    function countAnswered() {
      var answered = document.querySelectorAll('.jspsych-survey-multi-choice-question input[type="radio"]:checked');
      var answeredNames = new Set();
      answered.forEach(function(radio) {
        answeredNames.add(radio.name);
      });
      updateBar(answeredNames.size);
    }

    var surveyContainer = document.querySelector('.jspsych-content');
    if (surveyContainer) {
      surveyContainer.addEventListener('change', countAnswered);
    }
  };
}
